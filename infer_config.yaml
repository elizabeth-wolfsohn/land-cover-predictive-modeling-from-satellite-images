#
# YAML configuration file for infer.py
#
 
# the random seed, for reproducibility
# set to null for no random seed
seed: 42
# the size of each batch of images when performing prediction
batch_size: 32
# number of processes loading the data
num_workers: 8
# the path to the root folder of the dataset (group's layout: <set>/images, <set>/masks, csv_files/)
dataset_folder: './local_dataset'
# the path to the root directory used to store experiments
xp_rootdir: './code/experiments'
# the name of log directory for an experiment (result of training)
# you can set to 'last' to refer to the lastly created directory under in <xp_rootdir>
xp_name: 'last'
# the set to perform inference on:
#   'train', 'val' or 'test': the group's split (local_dataset/{train,validation,test}/images), to use with eval.py
#   'final_test': the official test set of the challenge (no masks), gives the CSV to submit
set: 'test'
# folder of the official test set (containing images/), only used with set: 'final_test'
final_test_folder: './dataset_UNZIPPED/test'
# the model checkpoint to use: 'best' (best validation KL, checkpoints/best.pt)
checkpoint_epoch: 'best'
# outputs in the experiment directory: <checkpoint>_<set>_predicted.csv, <checkpoint>_<set>_pred_masks/,
# <checkpoint>_<set>_inference_timing.json (final_test: no masks, CSV to submit = best_final_test_predicted.csv)
 
