# # YAML configuration file for train_rf.py
# #



seed: 42
dataset_folder: 'local_dataset'
xp_rootdir: 'experiments'
max_images: null
n_jobs: 2                 # CPU uniquement (ignoré si backend: gpu)

# Random Forest
n_per_image: 500
n_estimators: 50
max_depth: 25
min_samples_leaf: 100
class_weight: null  # CPU uniquement (ignoré si backend: gpu)
max_features: 'sqrt'
backend: gpu
rare_class_idx: [8]

# GPU (cuML) uniquement
n_bins: 128               # nombre de bins pour la recherche de seuils (cuML)
