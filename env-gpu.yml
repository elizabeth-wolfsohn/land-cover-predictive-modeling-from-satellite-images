name: challenge-ens-torch
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pillow
  - matplotlib
  - ipython
  - pandas
  - jupyter
  - tifffile
  - tqdm
  - pyyaml
  - pip
  - pip:
      # cu128 wheels ship native sm_120 (RTX 50xx) kernels and also run on CPU
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7
      - torchvision
      - timm>=1.0
