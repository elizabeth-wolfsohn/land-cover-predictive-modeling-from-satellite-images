---
#
# YAML configuration file for train.py
#

# the random seed, for reproducibility
# if null, no random seed
seed: 42
# the size of each batch of images when training
# careful not to use a too large batch size, might lead to OOM errors
batch_size: 16
# the number of epochs to train for
epochs: 20
# the learning rate
lr: 0.001
# the path to the root directory of the dataset (relative paths are relative to the repo root)
# it must contain train/images, train/masks and test/images
dataset_folder: '../additional_files_earthcube_emu4zqr/dataset'
# the path to the root directory used to store experiments
# a directory per experiment will be created named with the datetime during execution
xp_rootdir: 'experiments'
# use only a random subset of the images to go faster (null = all the images)
# the full set has ~16 600 training images and ~1 850 validation images
max_train_samples: 2000
max_val_samples: 300
# number of batches per "epoch" (null = one full pass over the training images).
# A short epoch updates the validation score, the curves and the prediction plots more often,
# for the same total training time (total images seen = epochs x steps_per_epoch x batch_size)
steps_per_epoch: 40
# number of epochs without improvement of the validation loss before halving the learning rate
lr_patience: 5
# CSV file containing the samples to use in the validation set
# if null, a random train/val split is performed, with 10% of the samples held out for validation
# the validation samples will be saved to a file 'val_samples.csv' in the experiment directory
val_samples_csv: null

# predefined train / validation / test split (CSV files with one 'sample_id' column), shared by
# the whole group. When train_image_path is set, val_samples_csv is ignored and the test images
# are never used for training (they are listed in <experiment>/test_samples.csv).
# Set train_image_path to null to go back to the random 90/10 train/validation split.
train_image_path: 'local_dataset/csv_files/train_images.csv'
val_image_path: 'local_dataset/csv_files/validation_images.csv'
test_image_path: 'local_dataset/csv_files/test_images.csv'

# the model to train
#   - unet          : benchmark U-Net (kwargs: num_layers)
#   - deeplabv3plus : DeepLabV3+ with a MobileNetV2 encoder (~1.1M parameters)
#       kwargs: pretrained   -> null (from scratch) or 'imagenet' (ImageNet RGB photos, not Sentinel-2;
#                               the NIR channel is initialised with the mean of the RGB filters)
#               backbone_alpha -> width multiplier of MobileNetV2 (0.35, 0.5, 0.75, 1.0)
model:
  name: deeplabv3plus
  kwargs:
    pretrained: null
    backbone_alpha: 1.0
# example to train the benchmark instead:
# model:
#   name: unet
#   kwargs:
#     num_layers: 2

# per-pixel weighting of the loss: null (all classes weighted 1) or 'inverse_sqrt_freq'
# (rare classes weighted more, clipped to 10). "no_data" and "clouds" are always weighted 0.
# per-class weights of the cross-entropy, given directly (group values, see the report):
# inverse square root of the class frequency, mean pixel weight 1, capped at 10 (snow).
# Order: no_data, clouds, artificial, cultivated, broadleaf, coniferous, herbaceous, natural, snow, water
class_weighting: [0., 0., 1.9104365, 0.7414725, 0.8962822, 1.5187677, 0.8169715, 4.7712197, 10., 2.7509751]
# null instead of the list above = no class weighting (weight 1, 0 for no_data / clouds)

# loss: 'ce' (pixel cross-entropy, benchmark) or 'ce_kl' (cross-entropy + KL of the class
# proportions of each image, mean of the softmax; same loss as the group's U-Net)
loss:
  type: ce_kl
  ce_weight: 1.0
  kl_weight: 10.0

# augmentation of the training images: flips + rotations are always applied.
# radiometric: false, true (default ranges below) or the ranges, applied on the image only:
#   prob (probability per image), brightness (global factor 1 +/- b), contrast (1 +/- c around the
#   band mean), band_jitter (factor per band R, G, B, NIR: 1 +/- j), noise (gaussian, x band std)
augmentation:
  radiometric: false
#  radiometric:
#    prob: 0.8
#    brightness: 0.1
#    contrast: 0.1
#    band_jitter: 0.05
#    noise: 0.03

# learning rate schedule: 'plateau' (halved after lr_patience epochs without improvement)
# or 'cosine' (linear warm-up over warmup_epochs, then cosine decay from lr to min_lr)
lr_schedule:
  type: plateau
  min_lr: 1.0e-5
  warmup_epochs: 2

# save only the checkpoints that improve val_kl (the best epoch is always kept): saves disk space
checkpoint_best_only: false
# optional suffix of the experiment folder name (e.g. 'imagenet_cekl_seed1')
xp_tag: null

# visualization (PNG files saved in <experiment>/plots/)
# open the figures automatically (Windows): dataset samples at the start, curves + predictions at the end
show_plots: true
# number of training samples shown in plots/dataset_samples.png
num_dataset_samples: 10
# number of validation images whose predictions are plotted after every epoch (predictions_epochXXX.png)
num_prediction_samples: 4
